# Jekyll config for GitHub Pages — do NOT publish internal machine files.
# Must NOT have .nojekyll, or exclude is ignored and the whole repo is public.

exclude:
  - seo-agent
  - seo-agent/
  - scripts
  - scripts/
  - worker
  - worker/
  - docs
  - docs/
  - Обновление
  - Обновление/
  - .github
  - .cursor
  - .env
  - .env.example
  - node_modules
  - _live-check
  - _site
  - vendor/bundle
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - CUSTOM-DOMAIN.md
  - FINRAZ-ONLINE-REDIRECT.md
  - OPTIONAL-DONE.md
  - SAMOZANYATOST.md
  - SEO-YANDEX.md
  - SETUP-YANDEX.md
  - DEPLOY.md
  - FINISH.md
  - MONETIZATION.md
  - TELEGRAM-FEEDBACK.md
  - "*.py"
  - "*.pyc"
  - "*.toml"
  - "*.example"

include:
  - .well-known
