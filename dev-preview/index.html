<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Просмотр FinPulse</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #141414;
        --bar: #1e1e1e;
        --line: #333;
        --text: #f2f2f0;
        --muted: #9a9a94;
        --field: #2a2a2a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 0.8rem;
        background: var(--bar);
        border-bottom: 1px solid var(--line);
      }

      header strong {
        font-weight: 650;
        white-space: nowrap;
      }

      header input {
        flex: 1;
        min-width: 0;
        height: 34px;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--text);
        padding: 0 0.7rem;
        font: inherit;
      }

      header button,
      .zoom-btn {
        height: 34px;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--text);
        font: inherit;
        padding: 0 0.8rem;
        cursor: pointer;
      }

      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 430px minmax(0, 1fr);
      }

      .pane {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
      }

      .desk-pane { border-right: 0; }

      .pane-bar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 40px;
        padding: 0.35rem 0.75rem;
        background: var(--bar);
        border-bottom: 1px solid var(--line);
        color: var(--muted);
      }

      .pane-bar b { color: var(--text); font-weight: 650; }

      .zoom-control {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-left: auto;
      }

      #zoom {
        width: 140px;
        accent-color: #d7d7d2;
      }

      #zoom-label {
        min-width: 3.2rem;
        text-align: right;
        color: var(--text);
      }

      .phone-stage,
      .desk-stage {
        flex: 1;
        min-height: 0;
        background: #0d0d0d;
      }

      .phone-stage {
        display: flex;
        justify-content: center;
        padding: 12px 0;
        overflow: auto;
      }

      #phone {
        width: 390px;
        height: 100%;
        min-height: 640px;
        border: 0;
        background: #fff;
        box-shadow: 0 0 0 1px #333;
      }

      .desk-stage { overflow: auto; }

      #desk {
        border: 0;
        background: #fff;
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Просмотр</strong>
      <input id="path" type="text" value="/zarplata-za-period.html" spellcheck="false" aria-label="Страница" />
      <button id="open" type="button">Открыть</button>
    </header>
    <main>
      <section class="pane phone-pane">
        <div class="pane-bar"><b>Телефон</b> 390 px</div>
        <div class="phone-stage">
          <iframe id="phone" title="Мобильная версия"></iframe>
        </div>
      </section>
      <section class="pane desk-pane">
        <div class="pane-bar">
          <b>Браузер</b>
          <span class="zoom-control">
            <button class="zoom-btn" id="zoom-out" type="button" aria-label="Уменьшить">−</button>
            <input id="zoom" type="range" min="50" max="160" value="100" step="10" aria-label="Масштаб" />
            <button class="zoom-btn" id="zoom-in" type="button" aria-label="Увеличить">+</button>
            <span id="zoom-label">100%</span>
          </span>
        </div>
        <div class="desk-stage" id="desk-stage">
          <iframe id="desk" title="Браузерная версия"></iframe>
        </div>
      </section>
    </main>
    <script>
      const pathInput = document.getElementById("path");
      const phone = document.getElementById("phone");
      const desk = document.getElementById("desk");
      const zoomInput = document.getElementById("zoom");
      const zoomLabel = document.getElementById("zoom-label");
      const stage = document.getElementById("desk-stage");

      function pageUrl() {
        const raw = pathInput.value.trim() || "/zarplata-za-period.html";
        if (/^https?:\/\//i.test(raw)) return raw;
        return raw.startsWith("/") ? raw : "/" + raw;
      }

      function openPage() {
        const url = pageUrl();
        phone.src = url;
        desk.src = url;
      }

      function applyZoom() {
        const zoom = Number(zoomInput.value) / 100;
        zoomLabel.textContent = zoomInput.value + "%";
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        desk.style.width = width + "px";
        desk.style.height = height + "px";
        desk.style.transform = "scale(" + zoom + ")";
      }

      function stepZoom(delta) {
        const next = Math.min(160, Math.max(50, Number(zoomInput.value) + delta));
        zoomInput.value = String(next);
        applyZoom();
      }

      document.getElementById("open").addEventListener("click", openPage);
      pathInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") openPage();
      });
      zoomInput.addEventListener("input", applyZoom);
      document.getElementById("zoom-out").addEventListener("click", () => stepZoom(-10));
      document.getElementById("zoom-in").addEventListener("click", () => stepZoom(10));
      window.addEventListener("resize", applyZoom);

      openPage();
      applyZoom();
    </script>
  </body>
</html>
