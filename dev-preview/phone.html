<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Телефон — FinPulse</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
      }
      iframe {
        display: block;
        width: 390px;
        height: 100%;
        margin: 0 auto;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <iframe id="screen" title="Мобильная версия"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const raw = params.get("page") || "/zarplata-za-period.html";
      document.getElementById("screen").src = raw.startsWith("/") ? raw : "/" + raw;
    </script>
  </body>
</html>
