name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build public tree (whitelist)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Copy only public site surface — never seo-agent / scripts / worker / docs
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cursor/' \
            --exclude 'seo-agent/' \
            --exclude 'scripts/' \
            --exclude 'worker/' \
            --exclude 'docs/' \
            --exclude 'Обновление/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '_site/' \
            --exclude '_live-check/' \
            --exclude '_design-concepts/' \
            --exclude '_config.yml' \
            --exclude '.gitignore' \
            --exclude '*.md' \
            --exclude '*.py' \
            --exclude '*.pyc' \
            --exclude '*.toml' \
            --exclude 'Gemfile*' \
            --exclude 'package*.json' \
            --exclude 'wrangler.toml' \
            ./ _site/

          # Safety net: purge if anything slipped through
          rm -rf _site/seo-agent _site/scripts _site/worker _site/docs _site/Обновление \
                 _site/.github _site/.cursor _site/node_modules _site/_live-check _site/_design-concepts
          find _site -type f \( -name '*.md' -o -name '*.py' -o -name '*.toml' -o -name '.env*' \) -delete

          test ! -e _site/seo-agent
          test ! -e _site/scripts
          test ! -e _site/worker
          test -f _site/index.html
          test -f _site/robots.txt
          echo "Public file count: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
