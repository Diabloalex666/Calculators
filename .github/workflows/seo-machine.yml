name: SEO machine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quality gate
        run: python scripts/quality-gate.py

  ping:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for GitHub Pages
        if: github.event_name == 'push'
        run: sleep 150
      - name: Health + IndexNow + Yandex recrawl
        env:
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          YANDEX_WEBMASTER_HOST_ID: ${{ secrets.YANDEX_WEBMASTER_HOST_ID }}
        run: python scripts/machine.py

  factory:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Factory
        env:
          CI: "true"
          FACTORY_DRIP: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          FACTORY_WRITE: "1"
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          YANDEX_WEBMASTER_HOST_ID: ${{ secrets.YANDEX_WEBMASTER_HOST_ID }}
          XMLRIVER_USER: ${{ secrets.XMLRIVER_USER }}
          XMLRIVER_KEY: ${{ secrets.XMLRIVER_KEY }}
          YANDEX_CLOUD_API_KEY: ${{ secrets.YANDEX_CLOUD_API_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: python scripts/factory.py
      - name: Alert if conveyor empty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/conveyor-alert.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-agent articles/index.html articles/*.html sitemap.xml
          git diff --cached --quiet && echo "no factory changes" && exit 0
          git commit -m "seo-factory: daily report [skip ci]"
          git push
